<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Code1124Dev | Web Development & Coding</title>

  <meta
    name="description"
    content="Web development, Python scripts, bug fixes and custom coding services."
  >

  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#070912">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;

      color: #111827;

      background:
        radial-gradient(circle at 15% 15%, rgba(122,92,255,.14), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(0,170,255,.10), transparent 28%),
        linear-gradient(180deg, #ffffff 0%, #f6f7fb 55%, #ffffff 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;

      background-image:
        linear-gradient(rgba(50,50,80,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(50,50,80,.035) 1px, transparent 1px);

      background-size: 48px 48px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;

      width: 100%;
      height: 68px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 max(14px, 5vw);

      z-index: 1000;

      background: rgba(255,255,255,.76);

      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);

      border-bottom: 1px solid rgba(20,25,50,.08);
    }

    .logo {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -.4px;
    }

    .logo span {
      background: linear-gradient(90deg, #735cff, #277cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;

      padding: 8px 11px;

      border: 1px solid rgba(34,197,94,.20);
      border-radius: 999px;

      background: rgba(34,197,94,.06);
      color: #16823a;

      font-size: 12px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #22c55e;

      box-shadow: 0 0 10px rgba(34,197,94,.65);
    }

    .language-wrap {
      position: relative;

      display: flex;
      align-items: center;
      gap: 8px;
    }

    .language-word {
      color: #737b91;
      font-size: 13px;
    }

    .language-button {
      display: flex;
      align-items: center;
      gap: 7px;

      padding: 9px 12px;

      border: 1px solid rgba(30,40,70,.10);
      border-radius: 12px;

      background: rgba(255,255,255,.75);
      color: #24283a;

      box-shadow: 0 5px 18px rgba(30,40,80,.06);
    }

    .language-menu {
      position: absolute;
      top: 48px;
      right: 0;

      width: 200px;

      padding: 8px;

      border: 1px solid rgba(30,40,70,.10);
      border-radius: 16px;

      background: rgba(255,255,255,.96);

      backdrop-filter: blur(22px);

      box-shadow: 0 20px 55px rgba(28,35,70,.16);

      opacity: 0;

      transform: translateY(-7px) scale(.97);

      pointer-events: none;

      transition: .18s;
    }

    .language-wrap.open .language-menu {
      opacity: 1;

      transform: translateY(0) scale(1);

      pointer-events: auto;
    }

    .language-option {
      width: 100%;

      padding: 11px 12px;

      display: flex;
      align-items: center;
      gap: 10px;

      border: none;
      border-radius: 10px;

      background: transparent;
      color: #282d40;

      text-align: left;
    }

    .language-option:hover {
      background: #f3f4f8;
    }

    .language-option.active {
      color: #5f4ee8;

      background: rgba(111,87,255,.09);

      font-weight: 700;
    }

    .hero {
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 115px 22px 70px;
    }

    .badge {
      padding: 8px 15px;
      margin-bottom: 24px;

      border: 1px solid rgba(95,80,210,.13);
      border-radius: 999px;

      background: rgba(255,255,255,.65);
      color: #686f84;

      font-size: 13px;

      box-shadow: 0 8px 30px rgba(50,55,90,.06);
    }

    .hero h1 {
      max-width: 900px;

      margin-bottom: 24px;

      font-size: clamp(45px, 9vw, 82px);
      line-height: 1.04;
      letter-spacing: -3px;

      color: #111525;
    }

    .gradient {
      background: linear-gradient(90deg, #805dff, #5c65f4, #168ce7);

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .subtitle {
      max-width: 700px;
      margin-bottom: 33px;

      color: #697188;

      font-size: 18px;
      line-height: 1.85;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 12px;
    }

    .btn {
      min-width: 155px;

      display: inline-flex;
      justify-content: center;
      align-items: center;

      padding: 14px 23px;

      border-radius: 13px;
      border: none;

      text-decoration: none;
      font-weight: 700;

      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      color: white;

      background: linear-gradient(135deg, #755cff, #437bf2);

      box-shadow: 0 12px 35px rgba(91,89,240,.24);
    }

    .btn-secondary {
      color: #35394c;

      border: 1px solid rgba(25,35,65,.11);

      background: rgba(255,255,255,.68);
    }

    .section {
      max-width: 1120px;

      margin: auto;

      padding: 85px 22px;
    }

    .section-title {
      text-align: center;

      margin-bottom: 11px;

      color: #141827;

      font-size: 34px;
    }

    .section-desc {
      text-align: center;

      margin-bottom: 40px;

      color: #7d8497;

      line-height: 1.7;
    }

    .cards {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 16px;
    }

    .card {
      padding: 25px;

      border-radius: 20px;

      border: 1px solid rgba(35,45,80,.08);

      background: rgba(255,255,255,.72);

      box-shadow: 0 14px 40px rgba(40,45,85,.05);

      transition: .22s;
    }

    .card:hover {
      transform: translateY(-5px);

      border-color: rgba(111,87,255,.22);

      box-shadow: 0 18px 48px rgba(70,70,120,.09);
    }

    .icon {
      margin-bottom: 16px;

      font-size: 31px;
    }

    .card h3 {
      margin-bottom: 10px;

      color: #1b2030;

      font-size: 19px;
    }

    .card p {
      color: #72798d;

      font-size: 14px;
      line-height: 1.7;
    }

    .payment-grid {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 13px;
    }

    .pay-step {
      padding: 21px;

      border: 1px solid rgba(35,45,80,.08);
      border-radius: 18px;

      background: rgba(255,255,255,.72);
    }

    .pay-number {
      width: 34px;
      height: 34px;

      margin-bottom: 13px;

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 11px;

      color: white;

      font-weight: 800;

      background: linear-gradient(135deg, #745cff, #4380ef);
    }

    .pay-step h3 {
      margin-bottom: 7px;

      color: #202536;

      font-size: 16px;
    }

    .pay-step p {
      color: #7a8194;

      font-size: 13px;
      line-height: 1.6;
    }

    .deposit-note {
      margin-top: 18px;

      padding: 18px 20px;

      border-radius: 15px;

      border: 1px solid rgba(111,87,255,.12);

      background: rgba(111,87,255,.045);

      color: #697085;

      line-height: 1.7;

      font-size: 13px;
    }

    .inquiry-box {
      padding: 27px;

      border: 1px solid rgba(35,45,80,.08);
      border-radius: 22px;

      background: rgba(255,255,255,.72);
    }

    .form-grid {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 13px;
    }

    .field {
      display: flex;
      flex-direction: column;

      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: #656c80;

      font-size: 13px;
      font-weight: 600;
    }

    .field input,
    .field textarea {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid rgba(40,50,80,.10);
      border-radius: 12px;

      background: rgba(249,250,253,.95);

      color: #222738;

      outline: none;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: rgba(111,87,255,.45);
    }

    .field textarea {
      min-height: 110px;

      resize: vertical;
    }

    .form-actions {
      margin-top: 14px;

      display: flex;

      gap: 9px;

      flex-wrap: wrap;
    }

    .small-btn {
      padding: 10px 14px;

      border: 1px solid rgba(35,45,80,.10);
      border-radius: 10px;

      background: #fff;
      color: #33384b;

      font-weight: 700;
    }

    .small-btn.primary {
      border: none;

      color: white;

      background: linear-gradient(135deg, #735cff, #4779ee);
    }

    .privacy {
      margin-top: 14px;

      color: #8d93a4;

      font-size: 12px;
      line-height: 1.6;
    }

    .contact-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 13px;
    }

    .contact-card {
      min-height: 78px;

      padding: 16px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border: 1px solid rgba(35,45,80,.08);
      border-radius: 17px;

      background: rgba(255,255,255,.76);

      color: #24293a;

      text-decoration: none;

      box-shadow: 0 12px 35px rgba(30,40,80,.04);

      transition: .2s;
    }

    .contact-card:hover {
      transform: translateY(-3px);

      border-color: rgba(111,87,255,.20);
    }

    .contact-left {
      display: flex;
      align-items: center;

      gap: 13px;
    }

    .contact-icon {
      width: 42px;
      height: 42px;

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 13px;

      background: #f1f2f7;

      font-size: 20px;
    }

    .contact-name {
      font-weight: 700;

      margin-bottom: 3px;
    }

    .contact-value {
      color: #858b9d;

      font-size: 12px;

      word-break: break-all;
    }

    .arrow {
      color: #a0a5b4;

      font-size: 18px;
    }

    .support {
      position: fixed;

      right: 18px;
      bottom: 18px;

      z-index: 5000;
    }

    .support-launch {
      width: 60px;
      height: 60px;

      border: none;
      border-radius: 50%;

      color: white;

      font-size: 24px;

      background: linear-gradient(135deg, #755cff, #397ff1);

      box-shadow: 0 15px 45px rgba(80,80,220,.32);
    }

    .chat {
      position: absolute;

      right: 0;
      bottom: 74px;

      width: 370px;
      height: 550px;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      border: 1px solid rgba(30,40,70,.09);
      border-radius: 23px;

      background: rgba(255,255,255,.97);

      box-shadow: 0 30px 85px rgba(25,30,65,.20);

      opacity: 0;

      transform: translateY(8px) scale(.97);

      pointer-events: none;

      transition: .2s;
    }

    .support.open .chat {
      opacity: 1;

      transform: translateY(0) scale(1);

      pointer-events: auto;
    }

    .chat-header {
      padding: 15px 16px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid rgba(35,45,80,.08);

      background:
        linear-gradient(
          135deg,
          rgba(113,87,255,.09),
          rgba(30,130,240,.05)
        );
    }

    .agent {
      display: flex;
      align-items: center;

      gap: 10px;
    }

    .agent-avatar {
      width: 40px;
      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;

      color: white;

      background: linear-gradient(135deg, #735cff, #4180f2);
    }

    .agent-name {
      color: #202536;

      font-weight: 800;

      font-size: 14px;
    }

    .agent-status {
      margin-top: 2px;

      color: #24914b;

      font-size: 11px;
    }

    .close-chat {
      border: none;

      background: transparent;

      color: #888fa1;

      font-size: 22px;
    }

    .chat-messages {
      flex: 1;

      overflow-y: auto;

      padding: 15px;

      display: flex;
      flex-direction: column;

      gap: 10px;
    }

    .message {
      max-width: 87%;

      padding: 10px 12px;

      border-radius: 14px;

      font-size: 13px;
      line-height: 1.6;
    }

    .bot {
      align-self: flex-start;

      background: #f2f3f7;

      color: #3a3f52;

      border-bottom-left-radius: 5px;
    }

    .user {
      align-self: flex-end;

      color: white;

      background: linear-gradient(135deg, #735cff, #477cf2);

      border-bottom-right-radius: 5px;
    }

    .quick-area {
      padding: 0 12px 9px;

      display: flex;

      gap: 6px;

      flex-wrap: wrap;
    }

    .quick-btn {
      padding: 6px 9px;

      border: 1px solid rgba(40,50,80,.09);
      border-radius: 999px;

      background: #f6f7fa;

      color: #60677a;

      font-size: 10px;
    }

    .chat-input-area {
      padding: 11px;

      display: flex;

      gap: 7px;

      border-top: 1px solid rgba(35,45,80,.08);
    }

    .chat-input {
      flex: 1;

      padding: 11px 12px;

      border: 1px solid rgba(35,45,80,.10);
      border-radius: 12px;

      background: #f8f9fb;

      color: #292e40;

      outline: none;
    }

    .send {
      width: 42px;

      border: none;
      border-radius: 12px;

      color: white;

      background: linear-gradient(135deg, #735cff, #407ef1);
    }

    .toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform: translateX(-50%) translateY(20px);

      padding: 10px 15px;

      border-radius: 11px;

      background: rgba(20,23,35,.9);

      color: white;

      font-size: 13px;

      opacity: 0;

      pointer-events: none;

      transition: .2s;

      z-index: 9999;
    }

    .toast.show {
      opacity: 1;

      transform: translateX(-50%) translateY(0);
    }

    footer {
      padding: 35px 20px 45px;

      text-align: center;

      color: #9298a8;

      font-size: 12px;
    }

    @media (max-width: 850px) {
      .cards {
        grid-template-columns: 1fr 1fr;
      }

      .payment-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 650px) {
      nav {
        height: 62px;
        padding: 0 11px;
      }

      .logo {
        font-size: 15px;
      }

      .status {
        display: none;
      }

      .language-word {
        display: none;
      }

      .language-button {
        padding: 8px 10px;

        font-size: 12px;
      }

      .hero {
        padding:
