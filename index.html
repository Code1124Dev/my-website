.lang{

.lang-btn{

}

.lang-menu{

  right:0;
  top:47px;

  padding:7px;

  background:white;

  border:1px solid rgba(30,40,70,.10);
  border-radius:14px;

  box-shadow:0 18px 50px rgba(20,30,70,.15);

  display:none;
}

.lang.open .lang-menu{

}

.lang-option{
  width:100%;

  padding:10px;

  border:0;
  border-radius:9px;

  background:transparent;

  text-align:left;
}

.lang-option:hover{

}

.lang-option.active{
  background:#f0edff;
  color:#6553df;
  font-weight:800;
}

/* HERO */

.hero{

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:110px 20px 60px;
}

.badge{
  padding:8px 14px;

  border:1px solid rgba(100,80,220,.12);
  border-radius:999px;

  background:rgba(255,255,255,.7);

  color:#6f7587;

  font-size:13px;

  margin-bottom:23px;
}

.hero h1{

  line-height:1.04;
  letter-spacing:-3px;

  margin-bottom:24px;
}

.gradient{

  color:transparent;
}

.subtitle{

  color:#70778b;

  font-size:18px;
  line-height:1.8;

  margin-bottom:30px;
}

.buttons{

  gap:11px;
  flex-wrap:wrap;
  justify-content:center;
}

.btn{

  border-radius:12px;

  text-decoration:none;
  font-weight:800;

  border:0;
}

.primary{
  color:white;
  background:linear-gradient(135deg,#755cff,#3e80f3);
}

.secondary{
  color:#34394b;

  background:white;

  border:1px solid rgba(30,40,70,.10);
}

.section{
  max-width:1100px;

  margin:auto;

  padding:80px 20px;
}

.title{
  text-align:center;

  font-size:34px;

  margin-bottom:10px;
}

.desc{
  text-align:center;

  color:#7d8497;

  margin-bottom:38px;

  line-height:1.7;
}

.cards{
  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:15px;
}

.card{
  padding:24px;

  border:1px solid rgba(35,45,80,.08);
  border-radius:19px;

  background:rgba(255,255,255,.78);

  box-shadow:0 12px 35px rgba(40,50,90,.05);
}

.icon{
  font-size:30px;

  margin-bottom:15px;
}

.card h3{
  margin-bottom:9px;
}

.card p{
  color:#757c8f;

  font-size:14px;
  line-height:1.7;
}

/* PAYMENT */

.payment{
  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:13px;
}

.step{
  padding:21px;

  border-radius:17px;

  background:white;

  border:1px solid rgba(30,40,70,.08);
}

.number{
  width:34px;
  height:34px;

  align-items:center;
  justify-content:center;

  border-radius:10px;

  background:linear-gradient(135deg,#745cff,#4080ef);

  color:white;

  font-weight:900;

  margin-bottom:12px;
}

.step h3{
  margin-bottom:7px;
  font-size:16px;
}

.step p{
  color:#7a8194;
  font-size:13px;
  line-height:1.6;
}

.note{
  margin-top:16px;

  padding:17px;

  border-radius:14px;

  background:rgba(110,85,255,.05);

  border:1px solid rgba(110,85,255,.12);

  color:#697085;

  font-size:13px;
  line-height:1.7;
}

/* FORM */

.form-box{
  padding:25px;

  background:white;

  border:1px solid rgba(30,40,70,.08);
  border-radius:20px;
}

.form-grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:13px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.full{
  grid-column:1/-1;
}

.field label{
  font-size:13px;
  font-weight:700;
  color:#646b7e;
}

.field input,
.field textarea{
  padding:13px;

  border:1px solid rgba(30,40,70,.12);
  border-radius:11px;

  background:#fafbfc;

  outline:none;
}

.field input:focus,
.field textarea:focus{

}

textarea{

  resize:vertical;
}

.actions{

  gap:8px;

  margin-top:14px;
}

.action{
  padding:10px 14px;

  border-radius:9px;

  border:1px solid rgba(30,40,70,.1);

  background:white;

  font-weight:800;

.action.main{

.privacy{

  color:#8b91a1;

  font-size:12px;
  line-height:1.6;
}

  gap:12px;

.contact-card{

.contact-left{

.contact-name{

.contact-value{

  font-size:12px;

  margin-top:3px;

  bottom:70px;

  height:520px;

  background:white;

  border:1px solid rgba(30,40,70,.1);

  flex-direction:column;

.chat-header{

  border-bottom:1px solid #eee;

.agent{
  font-weight:900;
}

.online{
  font-size:11px;

  color:#23934a;

  margin-top:2px;
}

.close{
  border:0;
  background:none;

  font-size:22px;

.messages{

  padding:14px;

  display:flex;
  flex-direction:column;

  gap:9px;

  line-height:1.55;

  background:#f2f3f7;

.user{
  align-self:flex-end;

  background:#6657ed;

  color:white;
}

.quick{
  padding:0 10px 8px;

  flex-wrap:wrap;

  gap:5px;

  padding:6px 8px;

  font-size:10px;
}

.chat-input{

  gap:7px;

  border-top:1px solid #eee;
}

.chat-input input{
  flex:1;

  padding:10px;

  border:1px solid #ddd;
  border-radius:10px;

  outline:none;
}

.chat-input button{
  width:40px;

  border:0;
  border-radius:10px;

  color:white;

  background:#6557ed;
}

.toast{
  position:fixed;

  bottom:25px;
  left:50%;

  transform:translateX(-50%);

  padding:10px 14px;

  background:#181b25;
  color:white;

  border-radius:10px;

  opacity:0;

  pointer-events:none;

  transition:.2s;

  z-index:9000;
}

.toast.show{
  opacity:1;
}

footer{
  text-align:center;

  padding:35px;

  color:#9298a8;

  font-size:12px;

@media(max-width:800px){

  .full{

  }

  .chat{
    position:fixed;

    left:9px;
    right:9px;
    bottom:78px;

    width:auto;

    height:72vh;
  }

}

$("bugText").textContent=x.bugText;

$("customText").textContent=x.customText;

$("paymentTitle").textContent=x.paymentTitle;
$("paymentDesc").textContent=x.paymentDesc;

$("p1").textContent=x.p1;

document.querySelectorAll(".lang-option")
.forEach(button=>{

);

}


$("langBtn").onclick=function(e){

$("lang").classList.toggle("open");

};

.forEach(button=>{

button.onclick=function(){

setLanguage(
button.dataset.lang
);

};

});

if(!$("lang").contains(e.target)){
$("lang").classList.remove("open");
}

});

$("support").classList.add("open");

};


$("chatButton").onclick=function(){

$("support").classList.toggle("open");

};


$("closeChat").onclick=function(){

$("support").classList.remove("open");

};


function addMessage(text,type){

const div=document.createElement("div");

div.className="message "+type;

div.textContent=text;

$("messages").appendChild(div);

$("messages").scrollTop=
$("messages").scrollHeight;

}


function resetChat(){

$("messages").innerHTML="";

addMessage(
translations[current].greeting,
"bot"
);

renderQuick();

}


function renderQuick(){

$("quick").innerHTML="";

translations[current].quick.forEach(q=>{

const b=document.createElement("button");

b.textContent=q;

b.onclick=function(){

$("chatInput").value=q;

sendMessage();

};

$("quick").appendChild(b);

});

}


function detectIntent(text){

const q=text.toLowerCase();

if(
q.includes("price") ||
q.includes("cost") ||
q.includes("多少钱") ||
q.includes("价格") ||
q.includes("料金") ||
q.includes("가격") ||
q.includes("precio") ||
q.includes("prix")
){
return "price";
}

if(
q.includes("30%") ||
q.includes("deposit") ||
q.includes("定金") ||
q.includes("着手金") ||
q.includes("계약금") ||
q.includes("depósito") ||
q.includes("acompte")
){
return "deposit";
}

if(
q.includes("bug") ||
q.includes("error") ||
q.includes("修复") ||
q.includes("バグ") ||
q.includes("버그") ||
q.includes("erreur")
){
return "bug";
}

if(
q.includes("time") ||
q.includes("多久") ||
q.includes("工期") ||
q.includes("納期") ||
q.includes("기간") ||
q.includes("plazo") ||
q.includes("délai")
){
return "time";
}

return "unknown";

}


function sendMessage(){

const input=$("chatInput");

const text=input.value.trim();

if(!text) return;

addMessage(text,"user");

input.value="";

const intent=detectIntent(text);

setTimeout(()=>{

addMessage(
translations[current].answers[intent],
"bot"
);

},250);

}


$("send").onclick=sendMessage;


$("chatInput").addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){
sendMessage();
}

}
);


let lastInquiry="";


$("generate").onclick=function(){

const x=translations[current];

const project=$("project").value.trim() || "-";
const budget=$("budget").value.trim() || "-";
const deadline=$("deadline").value.trim() || "-";
const reference=$("reference").value.trim() || "-";
const requirements=$("requirements").value.trim() || "-";


lastInquiry=
`${x.project}: ${project}
${x.budget}: ${budget}
${x.deadline}: ${deadline}
${x.reference}: ${reference}
${x.requirements}: ${requirements}`;


copyText(lastInquiry);

};


$("copy").onclick=function(){

if(!lastInquiry){

$("generate").click();

return;

}

copyText(lastInquiry);

};


async function copyText(text){

try{

await navigator.clipboard.writeText(text);

showToast();

}catch(e){

const area=document.createElement("textarea");

area.value=text;

document.body.appendChild(area);

area.select();

document.execCommand("copy");

area.remove();

showToast();

}

}


function showToast(){

$("toast").textContent=
translations[current].copied;

$("toast").classList.add("show");

setTimeout(()=>{

$("toast").classList.remove("show");

},1400);

}


setLanguage(current);

</script>
